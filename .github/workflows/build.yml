name: Build APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Unpack project
        run: unzip -q AuraBrowser.zip
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
 
      - name: Build debug APK
        working-directory: AuraBrowser
        run: gradle assembleDebug --no-daemon
 
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aura Browser build ${{ github.run_number }}
          files: AuraBrowser/app/build/outputs/apk/debug/app-debug.apk
