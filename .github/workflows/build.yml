name: Build APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Unpack newest zip
        run: |
          git -c core.quotepath=false log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' > /tmp/zips.txt
          newest=""
          while IFS= read -r f; do
            if [ -f "$f" ]; then newest="$f"; break; fi
          done < /tmp/zips.txt
          echo "Using archive: $newest"
          unzip -qo "$newest"
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
 
      - name: Build debug APK
        working-directory: AuraBrowser
        run: gradle assembleDebug --no-daemon
 
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aura Browser build ${{ github.run_number }}
          files: AuraBrowser/app/build/outputs/apk/debug/app-debug.apk
